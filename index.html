<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="成語猜猜猜">
<meta name="theme-color" content="#0F2926">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.json">
<script src="firebase-config.js"></script>
<title>成語猜猜猜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DDE8E1; --bg-deep:#C9D9CF; --ink:#1B2A26; --ink-soft:#4A5C56;
  --paper:#F7EBCF; --paper-edge:#D9C28E; --paper-ink:#2A1E12;
  --seal:#C0392B; --seal-deep:#8E2319; --gold:#C9962F; --jade:#2F7D6A;
  --panel:#EEF4F0; --line:rgba(27,42,38,.14);
  --kai:"LXGW WenKai TC","Kaiti TC","BiauKai","STKaiti","DFKai-SB",serif;
  --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F2926; --bg-deep:#0A1E1B; --ink:#E6EFEA; --ink-soft:#9DB3AB;
    --panel:#16362F; --line:rgba(230,239,234,.14); --jade:#5FB8A0; --gold:#E0B34A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F2926; --bg-deep:#0A1E1B; --ink:#E6EFEA; --ink-soft:#9DB3AB;
  --panel:#16362F; --line:rgba(230,239,234,.14); --jade:#5FB8A0; --gold:#E0B34A;
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{height:100%;max-width:520px;margin:0 auto;position:relative;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0;padding:12px 16px 16px}
.screen.on{display:flex}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--panel)}
.coins{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:22px;padding:8px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FBE39A,var(--gold) 60%,#8A6415);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);position:relative}
.coin::after{content:"";position:absolute;inset:6px;border:1.5px solid rgba(90,60,10,.55)}
.bar h2{margin:0;font-family:var(--kai);font-size:22px;font-weight:700}

/* ---------- home ---------- */
.home{justify-content:space-between}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.title{display:grid;grid-template-columns:repeat(3,auto);gap:8px}
.title span{width:clamp(74px,24vw,104px);aspect-ratio:1;display:grid;place-items:center;
  font-family:var(--kai);font-weight:700;font-size:clamp(46px,15vw,66px);
  background:var(--paper);color:var(--paper-ink);border-radius:10px;
  box-shadow:0 5px 0 var(--paper-edge),0 10px 20px rgba(0,0,0,.18)}
.title span:nth-child(2){transform:rotate(-4deg) translateY(-6px)}
.title span:nth-child(3){background:var(--seal);color:#FBEFE0;box-shadow:0 5px 0 var(--seal-deep),0 10px 20px rgba(0,0,0,.2);transform:rotate(3deg)}
.sub{font-family:var(--kai);font-size:26px;letter-spacing:.3em;margin-top:-6px;color:var(--ink-soft)}
.rank{display:flex;flex-direction:column;align-items:center;gap:6px}
.rank b{font-family:var(--kai);font-size:30px}
.rank small{color:var(--ink-soft);font-size:14px}
.progress{width:220px;height:8px;border-radius:4px;background:var(--bg-deep);overflow:hidden}
.progress i{display:block;height:100%;background:var(--seal);border-radius:4px;transition:width .4s}
.menu{display:grid;gap:12px}
.btn{height:56px;border-radius:14px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.primary{background:var(--seal);color:#FFF4E6;box-shadow:0 4px 0 var(--seal-deep)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--seal-deep)}
.btn.ghost{background:var(--panel);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ver{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:12px;font-variant-numeric:tabular-nums;opacity:.8}
.pill{font-size:13px;font-weight:500;background:var(--gold);color:#2A1E00;border-radius:10px;padding:2px 8px}

/* ---------- level select ---------- */
.levels{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 20px;margin:0 -2px}
.chapter{width:100%;margin:10px 0 0;padding:14px 12px;border-radius:12px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;text-align:left}
.chapter.open{margin-bottom:10px;box-shadow:inset 0 0 0 2px var(--seal)}
.chapter.locked{opacity:.55}
.chapter .chev{display:inline-block;margin-left:8px;font-style:normal;font-size:18px;transition:transform .2s}
.chapter.open .chev{transform:rotate(90deg)}
.chapter h3{margin:0;font-family:var(--kai);font-size:22px}
.chapter span{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lv{aspect-ratio:1;border-radius:12px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:18px;position:relative;font-variant-numeric:tabular-nums}
.lv.done{background:var(--seal);color:#FFF1E2}
.lv .st{font-size:10px;letter-spacing:1px;color:#FFD774}
.lv.lock{opacity:.4}
.lv.next{box-shadow:inset 0 0 0 3px var(--seal)}

/* ---------- play ---------- */
.play{gap:12px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding-top:4px}
.controls{display:flex;flex-direction:column;gap:10px}
.card{flex:1;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:34px 10px 10px;
  box-shadow:0 6px 0 var(--paper-edge),0 14px 26px rgba(0,0,0,.16);position:relative;text-align:center;
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:7px 7px}
.clueBox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;container-type:size}
.ill{display:block}
.clueBox .ill{width:min(100cqw,100cqh*1.4286);height:auto;aspect-ratio:400/280;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.scene{position:relative;flex:none}
.scene span{position:absolute;line-height:1;white-space:nowrap;transform-origin:center}
.scene .k{font-family:var(--kai);font-weight:700}
.a2hs{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.a2hs span{flex:1;line-height:1.5}
.a2hs button{font-size:18px;width:28px;height:28px;border-radius:50%;flex:none}
.account{background:rgba(0,0,0,.05);border-radius:14px;padding:12px;margin:4px 0 6px}
.account .who{display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.45}
.account .who b{display:block}
.account .who small{color:#7A5E36;font-size:13px}
.account .avatar{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px;background:var(--paper-edge);overflow:hidden}
.account .avatar img{width:100%;height:100%;object-fit:cover}
.accBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.accBtns .btn{height:42px;font-size:15px}
.accBtns .btn.gg{background:#fff;color:#222;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.cloudline{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:4px;min-height:1em}
.rec-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:0 0 12px}
.rec-sum b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.rec-sum small{font-size:12px;color:#7A5E36}
.rec-list{max-height:48vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid rgba(0,0,0,.1)}
.rec{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;align-items:center;padding:9px 2px;border-bottom:1px solid rgba(0,0,0,.08)}
.rec .no{font-weight:700;color:var(--seal);font-variant-numeric:tabular-nums;grid-row:span 2}
.rec .nm{font-family:var(--kai);font-size:20px;font-weight:700}
.rec .sr{color:var(--gold);letter-spacing:2px;font-size:14px;text-align:right}
.rec .dt{grid-column:2 / 4;font-size:12px;color:#7A5E36;font-variant-numeric:tabular-nums}
.saveio{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.saveio .btn{height:44px;font-size:15px}
.clue{font-size:clamp(52px,17vw,84px);line-height:1.2;letter-spacing:4px;word-break:break-all;max-width:100%}
.clue.long{font-size:clamp(44px,13vw,68px)}
.lvlabel{position:absolute;top:10px;left:14px;font-family:var(--kai);font-size:16px;color:#8A6A3A}
.rewardTag{position:absolute;top:8px;right:10px;display:flex;align-items:center;gap:5px;font-size:14px;font-weight:700;
  font-family:var(--sans);padding:3px 10px 3px 6px;border-radius:14px;background:rgba(201,150,47,.18);color:#6B4C10;font-variant-numeric:tabular-nums}
.rewardTag .coin{width:14px;height:14px}
.rewardTag .coin::after{inset:4px;border-width:1px}
.rewardTag.full{background:var(--gold);color:#2A1E00}
.rewardTag.done{background:rgba(0,0,0,.07);color:#7A6A55;padding-left:10px}
.rewardTag.drop{animation:drop .5s}
@keyframes drop{0%{transform:scale(1)}30%{transform:scale(1.25)}100%{transform:scale(1)}}
.textclue{margin-top:10px;font-family:var(--kai);font-size:18px;color:var(--seal-deep);min-height:1.4em}
.slots{display:flex;justify-content:center;gap:10px;margin-top:4px}
.slot{width:clamp(62px,19vw,76px);aspect-ratio:1;border-radius:12px;display:grid;place-items:center;
  font-family:var(--kai);font-weight:700;font-size:clamp(36px,11vw,44px);
  background:var(--bg-deep);box-shadow:inset 0 3px 0 rgba(0,0,0,.12);color:var(--ink)}
.slot.fill{background:var(--paper);color:var(--paper-ink);box-shadow:0 4px 0 var(--paper-edge)}
.slot.locked{background:var(--jade);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.slot.bad{background:#E9B7AE;color:var(--seal-deep);box-shadow:0 4px 0 #C98A7E}
.slots.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.hints{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hint{background:var(--panel);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:15px}
.hint small{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--ink-soft)}
.hint small .coin{width:12px;height:12px}
.hint small .coin::after{inset:3.5px;border-width:1px}
.hint:disabled{opacity:.4}
.pool{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ch{aspect-ratio:1;border-radius:12px;background:var(--paper);color:var(--paper-ink);
  font-family:var(--kai);font-weight:700;font-size:clamp(28px,8.5vw,36px);display:grid;place-items:center;
  box-shadow:0 4px 0 var(--paper-edge);transition:transform .08s}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 var(--paper-edge)}
.ch.used,.ch.gone{visibility:hidden}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(8,18,16,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.mask.on{display:flex}
.modal{width:100%;max-width:420px;background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:26px 20px 20px;position:relative;
  box-shadow:0 8px 0 var(--paper-edge),0 24px 50px rgba(0,0,0,.35);max-height:calc(100% - 20px);overflow-y:auto}
.seal{position:absolute;top:-26px;right:16px;width:84px;height:84px;border:4px solid var(--seal);color:var(--seal);border-radius:10px;
  display:grid;grid-template-columns:1fr 1fr;place-items:center;font-family:var(--kai);font-weight:700;font-size:30px;line-height:1;
  background:rgba(247,235,207,.9);transform:rotate(12deg);padding:4px}
.seal.stamp{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:rotate(12deg) scale(2.6);opacity:0}60%{opacity:1}100%{transform:rotate(12deg) scale(1)}}
.answer{font-family:var(--kai);font-weight:700;font-size:48px;letter-spacing:.12em;margin:4px 0 2px}
.stars{font-size:26px;letter-spacing:6px;color:var(--gold);min-height:1.2em}
.stars .off{color:rgba(0,0,0,.15)}
.meaning{font-family:var(--kai);font-size:19px;line-height:1.75;margin:12px 0 4px}
.source{font-size:14px;color:#7A5E36}
.reward{margin:12px 0 16px;font-weight:700;display:flex;align-items:center;gap:6px}
.modal .btn.ghost{background:rgba(0,0,0,.06);box-shadow:none;color:var(--paper-ink)}
.modal h3{font-family:var(--kai);font-size:26px;margin:0 0 10px}
.modal p{line-height:1.7;margin:0 0 12px;font-size:15px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.1);font-size:16px}
.toggle{width:52px;height:30px;border-radius:15px;background:rgba(0,0,0,.2);position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on{background:var(--jade)}
.toggle.on::after{left:25px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:22px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;white-space:nowrap}
.toast.on{opacity:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:6px 0 14px}
.stats b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stats small{font-size:12px;color:#7A5E36}

/* ---------- 成語卡冊 ---------- */
.btn .cnt{font-size:13px;font-weight:500;background:rgba(0,0,0,.08);border-radius:10px;padding:1px 8px;font-variant-numeric:tabular-nums}
.cardTools{display:flex;gap:8px;align-items:center;margin:10px 0 4px}
.cardTools input{flex:1;min-width:0;height:40px;border-radius:12px;border:0;background:var(--panel);color:var(--ink);padding:0 12px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.cardTools input::placeholder{color:var(--ink-soft)}
.chip{height:40px;padding:0 12px;border-radius:12px;background:var(--panel);font-size:14px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--seal);color:#FFF4E6}
.cardMeta{font-size:13px;color:var(--ink-soft);margin:6px 2px 10px;font-variant-numeric:tabular-nums}
.cardGrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start;padding:2px 2px 24px;margin:0 -2px}
.icard{position:relative;width:100%;min-width:0;aspect-ratio:3/4;perspective:800px;content-visibility:auto;contain-intrinsic-size:auto 200px}
.icard .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.icard.flip .in{transform:rotateY(180deg)}
.icard .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:22px 8px 12px;text-align:center;overflow:hidden;
  background:var(--paper);color:var(--paper-ink);box-shadow:0 4px 0 var(--paper-edge),0 8px 16px rgba(0,0,0,.12);
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:7px 7px}
.icard .rear{transform:rotateY(180deg)}
.icard .no{position:absolute;top:8px;left:10px;font-size:12px;font-weight:700;color:#8A6A3A;font-variant-numeric:tabular-nums}
.icard .st{position:absolute;top:7px;right:9px;font-size:11px;letter-spacing:1px;color:var(--gold)}
.icard .thumb{width:100%;height:auto;border-radius:8px;flex:none}
.icard .emo{font-size:clamp(24px,8vw,32px);line-height:1.25;word-break:break-all;max-width:100%}
.icard .word{font-family:var(--kai);font-weight:700;font-size:clamp(26px,8vw,34px);line-height:1.15;letter-spacing:.02em;white-space:nowrap}
.icard .word.v{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.12em;font-size:clamp(30px,9.5vw,38px)}
.icard .mean{font-size:12px;line-height:1.5;color:#6B5436;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 4px}
.icard .qm{font-family:var(--kai);font-size:30px;color:#B9A27A;letter-spacing:.2em}
.icard .tap{font-size:11px;color:#9A8260}
.emptyCards{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:40px 12px;line-height:1.8}
.cdEmo{margin:6px 0 10px}
.cdEmo .ill{width:100%;height:auto;border-radius:12px}
.cdWord{font-family:var(--kai);font-weight:700;font-size:46px;letter-spacing:.14em;margin:0}
.cdStars{color:var(--gold);letter-spacing:4px;font-size:18px;min-height:1.2em}
.cdRow{font-size:14px;color:#7A5E36;margin:6px 0 0;line-height:1.6}
.cdRow b{color:var(--paper-ink);font-weight:700;margin-right:6px}
.cdNav{display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:8px;margin-top:16px}
.cdNav .btn{height:48px;font-size:16px}
.cdNav .arrow{font-size:22px;background:rgba(0,0,0,.06);border-radius:14px}
.cdNav .arrow:disabled{opacity:.3}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:700px){.clue,.clue.long{font-size:42px}.card{min-height:120px;padding:28px 8px 8px}.pool{gap:6px}.stage{gap:8px}.hint{padding:5px 4px}.ch{aspect-ratio:1.35;font-size:26px}.slot{width:clamp(50px,14vw,60px);font-size:30px}.play{gap:8px}.controls{gap:8px}}
@media (max-height:760px) and (min-height:701px){.ch{aspect-ratio:1.15}}
</style>
</head>
<body>
<div class="app">

  <!-- 首頁 -->
  <section class="screen home on" id="sHome">
    <div class="bar">
      <button class="back" id="btnSettings" aria-label="設定">⚙︎</button>
      <div class="coins"><span class="coin"></span><span class="coinVal">0</span></div>
    </div>
    <div class="hero">
      <div class="title" aria-label="猜成語"><span>猜</span><span>成</span><span>語</span></div>
      <div class="sub">看圖闖關</div>
      <div class="rank">
        <b id="rankName">童生</b>
        <div class="progress"><i id="rankBar" style="width:0"></i></div>
        <small id="rankText">已過 0 / 1000 關</small>
      </div>
    </div>

const PER = 50; // 每卷關數
const CHAPTERS = ['童生','秀才','廩生','貢生','監生','舉人','解元','貢士','會元','進士',
                  '傳臚','探花','榜眼','狀元','庶吉士','編修','侍講','學士','翰林','大學士'];
const CN_NUM = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];
const RANKS = CHAPTERS.map((n,i)=>[i*PER,n]).concat([[1000,'文曲星']]);
const EXTRA = '天地日月風雲山川金木土人口手心目耳頭足馬牛羊雞狗龍虎鳥魚花草竹石光明東西南北上下左右大小多少長短高低前後春秋冬夏紅白黑青公王家國門開關行走飛來去生死';
const ALL_CHARS = [...new Set((PUZZLES.map(p=>p[1]).join('')+EXTRA).split(''))];
const COST = {reveal:30, remove:20, clue:10};

/* ================= 存檔 ================= */
const KEY = 'idiom-guess-v1';
const fresh = () => ({coins:100, cleared:{}, levels:{}, lastSign:'', streak:0, sound:true, theme:'auto', updatedAt:0,
  stats:{coinsEarned:0, coinsSpent:0, hints:0, wrongs:0, playSec:0, clears:0, signDays:0}});
const DEVICE_PREFS = ['sound','theme','a2hsOff']; // 只存在本機、不同步
let S = load();
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){}
  return fresh();
}
function normalize(o){ const f=fresh(); const n=Object.assign(f, o); n.stats=Object.assign(fresh().stats, o.stats||{}); return n; }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){ S.updatedAt=Date.now(); saveLocal(); if(window.Cloud) Cloud.schedule(); }

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr, r){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function today(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function clearedCount(){ return Object.keys(S.cleared).length; }
function rankOf(n){ let r=RANKS[0][1]; for(const [k,v] of RANKS) if(n>=k) r=v; return r; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),1600); }
function refreshCoins(){ document.querySelectorAll('.coinVal').forEach(e=>e.textContent=S.coins); }
function applyTheme(){
  const r=document.documentElement;
  if(S.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.theme);
  $('btnTheme').textContent = {auto:'跟隨系統',light:'淺色',dark:'深色'}[S.theme];
}

/* ================= 音效 ================= */
let AC=null;
function beep(freqs, dur=.09, type='triangle', vol=.14){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    let t = AC.currentTime;
    freqs.forEach(f=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur); t+=dur*.8;
    });
  }catch(e){}
}
const sfx = {
  tap:()=>beep([660],.05),
  back:()=>beep([440],.05),
  wrong:()=>beep([220,180],.14,'square',.08),
  win:()=>beep([523,659,784,1047],.12),
  coin:()=>beep([988,1319],.08,'sine'),
};

/* ================= 畫面切換 ================= */
function pauseTimer(){ if(L && !L.paused){ L.st.sec=(L.st.sec||0)+(Date.now()-L.t0)/1000; L.paused=true; } }
function resumeTimer(){ if(L && L.paused && $('sPlay').classList.contains('on') && !L.busy){ L.t0=Date.now(); L.paused=false; } }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ pauseTimer(); saveLocal(); if(window.Cloud) Cloud.flush(); } else resumeTimer(); });
function go(id){
  if(id!=='sPlay') pauseTimer();
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id));
  if(id==='sHome') renderHome();
  if(id==='sCards') renderCards();
  if(id==='sLevels'){ openCh=null; renderLevels.scrolled=false; renderLevels(); }
  refreshCoins();
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ sfx.back(); go(b.dataset.go); });

/* ================= 首頁 ================= */
function firstUnsolved(){ for(let i=0;i<PUZZLES.length;i++) if(!S.cleared[i]) return i; return -1; }
function renderHome(){
  const n=clearedCount();
  $('rankName').textContent = rankOf(n);
  $('rankBar').style.width = (n/PUZZLES.length*100)+'%';
  $('rankText').textContent = `已過 ${n} / ${PUZZLES.length} 關`;
  $('cardCnt').textContent = n;
  const nx = firstUnsolved();
  $('btnContinue').textContent = n===0 ? '開始闖關' : nx<0 ? '全部過關！重溫第 1 關' : `繼續第 ${nx+1} 關`;
  const signed = S.lastSign===today();
  $('btnSign').disabled = signed;
  $('btnSign').innerHTML = signed ? '今日已簽到' : '每日簽到 <span class="pill">+'+signReward()+'</span>';
}
function signReward(){
  const y = new Date(); y.setDate(y.getDate()-1);
  const streak = S.lastSign===today(y) ? S.streak+1 : 1;
  return 20 + Math.min(streak-1,6)*5;
}
$('btnContinue').onclick=()=>{ sfx.tap(); const nx=firstUnsolved(); startLevel(nx<0?0:nx); };
$('btnLevels').onclick=()=>{ sfx.tap(); go('sLevels'); };
$('btnSign').onclick=()=>{
  const y=new Date(); y.setDate(y.getDate()-1);
  const reward=signReward();
  S.streak = S.lastSign===today(y) ? S.streak+1 : 1;
  S.lastSign = today(); S.coins += reward; S.stats.coinsEarned += reward; S.stats.signDays++; save();
  sfx.coin(); toast(`簽到成功，獲得 ${reward} 金幣（連續 ${S.streak} 天）`);
  renderHome(); refreshCoins();
};

/* ================= 關卡列表 ================= */
function unlocked(i){ return i===0 || !!S.cleared[i-1] || !!S.cleared[i]; }
let openCh = null; // 關卡列表目前展開的卷
function renderLevels(){
  const box=$('levelList'); box.innerHTML='';
  const nx=firstUnsolved();
  const curCh = Math.floor((nx<0?0:nx)/PER);
  if(openCh===null) openCh = curCh;
  CHAPTERS.forEach((name,c)=>{
    const from=c*PER, to=Math.min(from+PER,PUZZLES.length);
    if(from>=PUZZLES.length) return;
    let done=0; for(let i=from;i<to;i++) if(S.cleared[i]) done++;
    const locked = !unlocked(from);
    const isOpen = c===openCh;
    const head=document.createElement('button'); head.className='chapter'+(isOpen?' open':'')+(locked?' locked':'');
    head.setAttribute('aria-expanded', isOpen);
    head.innerHTML=`<h3>第${CN_NUM[c]}卷・${name}</h3><span>${locked?'🔒 ':''}${done} / ${to-from}<i class="chev">›</i></span>`;
    head.onclick=()=>{ sfx.tap(); openCh = isOpen ? -1 : c; renderLevels();
      if(!isOpen) requestAnimationFrame(()=>box.querySelectorAll('.chapter')[c].scrollIntoView({block:'start',behavior:'smooth'})); };
    box.appendChild(head);
    if(!isOpen) return;
    const g=document.createElement('div'); g.className='grid5';
    for(let i=from;i<to;i++){
      const b=document.createElement('button'); b.className='lv';
      const cl=S.cleared[i];
      if(cl){ b.classList.add('done'); b.innerHTML=`${i+1}<span class="st">${'★'.repeat(cl.stars)}</span>`; }
      else if(unlocked(i)){ b.textContent=i+1; if(i===nx) b.classList.add('next'); }
      else { b.classList.add('lock'); b.innerHTML='🔒'; b.setAttribute('aria-label',`第 ${i+1} 關（未解鎖）`); }
      b.onclick=()=>{ if(!unlocked(i)){ sfx.wrong(); toast('先過前一關才能解鎖'); return; } sfx.tap(); startLevel(i); };
      g.appendChild(b);
    }
    box.appendChild(g);
  });
  const nb = box.querySelector('.next');
  if(nb && openCh===curCh && !renderLevels.scrolled){ renderLevels.scrolled=true; requestAnimationFrame(()=>nb.scrollIntoView({block:'center'})); }
}

/* ================= 遊戲 ================= */
let L = null; // 當前關卡狀態
function levelState(i){
  if(!S.levels[i]) S.levels[i] = {revealed:[], removed:false, clue:false, hints:0, wrong:0};
  return S.levels[i];
}
function startLevel(i){
  const [clue, ans] = PUZZLES[i];
  const r = rng(i*7919+17);
  const answerChars = ans.split('');
  const others = shuffle(ALL_CHARS.filter(c=>!answerChars.includes(c)), r).slice(0,16);
  const tiles = shuffle(answerChars.concat(others), r).map(ch=>({ch, used:false, gone:false}));
  const st = levelState(i);
  L = { i, ans:answerChars, tiles, slots:[null,null,null,null], locked:[false,false,false,false], st, busy:false, t0:Date.now(), paused:false };
  // 還原已購買提示
  if(st.removed) markRemoved();
  st.revealed.forEach(k=>lockSlot(k));
  go('sPlay');
  $('lvLabel').textContent=`第 ${i+1} 關`;
  $('playRank').textContent = CHAPTERS[Math.floor(i/PER)];
  $('rewardTag').dataset.v = '';
  renderClue(i);
  renderPlay();
}
function clueSVG(i, cls=''){ return ILLUS[i] ? ILL.render(ILLUS[i], cls) : ''; }
function renderClue(i){ $('clueBox').innerHTML = clueSVG(i); }
function fitScene(){}
function markRemoved(){
  // 移除 8 個錯字（固定順序，避免重整後不同）
  let n=0;
  L.tiles.forEach(t=>{ if(n<8 && !L.ans.includes(t.ch)){ t.gone=true; n++; } });
}
function lockSlot(k){
  const ch = L.ans[k];
  // 先清掉這格原本的字
  if(L.slots[k]!==null){ L.tiles[L.slots[k]].used=false; L.slots[k]=null; }
  let idx = L.tiles.findIndex(t=>t.ch===ch && !t.used && !t.gone);
  if(idx<0){ // 被放到別格了，拿回來
    const j = L.slots.findIndex((s,jj)=>s!==null && !L.locked[jj] && L.tiles[s].ch===ch);
    idx = L.slots[j]; L.slots[j]=null;
  }
  L.tiles[idx].used=true; L.slots[k]=idx; L.locked[k]=true;
}
function renderPlay(){
  const sl=$('slots'); sl.innerHTML='';
  const full = L.slots.every(s=>s!==null);
  const wrongNow = full && L.slots.map(s=>L.tiles[s].ch).join('')!==L.ans.join('');
  L.slots.forEach((s,k)=>{
    const b=document.createElement('button'); b.className='slot';
    if(s!==null){ b.textContent=L.tiles[s].ch; b.classList.add(L.locked[k]?'locked':(wrongNow?'bad':'fill')); }
    b.setAttribute('aria-label', s!==null ? `第${k+1}字：${L.tiles[s].ch}` : `第${k+1}字：空`);
    b.onclick=()=>{ if(L.busy||s===null||L.locked[k]) return; sfx.back(); L.tiles[s].used=false; L.slots[k]=null; renderPlay(); };
    sl.appendChild(b);
  });
  const pool=$('pool'); pool.innerHTML='';
  L.tiles.forEach((t,idx)=>{
    const b=document.createElement('button'); b.className='ch'; b.textContent=t.ch;
    if(t.used) b.classList.add('used'); if(t.gone) b.classList.add('gone');
    b.onclick=()=>pick(idx); pool.appendChild(b);
  });
  updateRewardTag();
  $('textClue').textContent = L.st.clue ? `提示：${PUZZLES[L.i][2]}` : '';
  $('hRemove').disabled = L.st.removed;
  $('hClue').disabled = L.st.clue;
  fitScene();
  $('hReveal').disabled = L.locked.every(Boolean);
  refreshCoins();
}
function levelReward(){
  if(S.cleared[L.i]) return null;
  return (L.st.hints===0 && L.st.wrong===0) ? 15 : 10;
}
function updateRewardTag(){
  const tag=$('rewardTag'), r=levelReward();
  const prev = tag.dataset.v, now = r===null ? 'done' : String(r);
  if(r===null){ tag.className='rewardTag done'; tag.textContent='已領取'; tag.setAttribute('aria-label','這關的金幣已經領過'); }
  else { tag.className='rewardTag'+(r===15?' full':''); tag.innerHTML=`<span class="coin"></span>+${r}`; tag.setAttribute('aria-label',`過關可得 ${r} 金幣`); }
  if(prev && prev!==now && prev!=='done'){ void tag.offsetWidth; tag.classList.add('drop'); }
  tag.dataset.v = now;
}
function pick(idx){
  if(L.busy) return;
  const t=L.tiles[idx]; if(t.used||t.gone) return;
  const k=L.slots.findIndex(s=>s===null); if(k<0) return;
  sfx.tap(); t.used=true; L.slots[k]=idx;
  if(L.slots.every(s=>s!==null)) check(); else renderPlay();
}
function check(){
  const guess=L.slots.map(s=>L.tiles[s].ch).join('');
  renderPlay();
  if(guess===L.ans.join('')) return win();
  L.st.wrong++; S.stats.wrongs++; save(); sfx.wrong(); updateRewardTag();
  const sl=$('slots'); sl.classList.remove('shake'); void sl.offsetWidth; sl.classList.add('shake');
  toast('不對喔，點上面的字可以拿回來');
}
function spend(cost){
  if(S.coins<cost){ sfx.wrong(); toast(`金幣不足（需要 ${cost}），去首頁簽到領金幣吧`); return false; }
  S.coins-=cost; L.st.hints++; S.stats.coinsSpent+=cost; S.stats.hints++; sfx.coin(); return true;
}
$('hReveal').onclick=()=>{
  if(L.busy) return;
  const k = L.ans.findIndex((ch,kk)=>!L.locked[kk]); if(k<0) return;
  // 優先揭露填錯或空著的格
  let target = L.ans.findIndex((ch,kk)=>!L.locked[kk] && (L.slots[kk]===null || L.tiles[L.slots[kk]].ch!==ch));
  if(target<0) target=k;
  if(!spend(COST.reveal)) return;
  lockSlot(target); L.st.revealed.push(target); save();
  if(L.slots.every(s=>s!==null)) check(); else renderPlay();
};
$('hRemove').onclick=()=>{
  if(L.busy||L.st.removed) return;
  if(!spend(COST.remove)) return;
  // 若被刪的字正放在格子裡，先退回
  L.st.removed=true; markRemoved();
  L.slots.forEach((s,k)=>{ if(s!==null && L.tiles[s].gone){ L.tiles[s].used=false; L.slots[k]=null; } });
  save(); renderPlay();
};
$('hClue').onclick=()=>{
  if(L.busy||L.st.clue) return;
  if(!spend(COST.clue)) return;
  L.st.clue=true; save(); renderPlay();
};

function win(){
  L.busy=true;
  const st=L.st;
  const stars = (st.hints===0 && st.wrong===0) ? 3 : (st.hints<=1 && st.wrong<=2) ? 2 : 1;
  const first = !S.cleared[L.i];
  const prev = S.cleared[L.i];
  let reward=0;
  pauseTimer();
  const sec = Math.round(st.sec||0), now = Date.now();
  if(first){ reward = 10 + (stars===3?5:0); S.coins+=reward; S.stats.coinsEarned+=reward; }
  S.stats.clears++; S.stats.playSec += sec;
  S.cleared[L.i] = prev ? {
      ...prev, stars:Math.max(stars, prev.stars||0), last:now, plays:(prev.plays||1)+1,
      best: prev.best ? Math.min(prev.best, sec) : sec
    } : { stars, t:now, last:now, plays:1, hints:st.hints, wrong:st.wrong, sec, best:sec };
  delete S.levels[L.i]; // 重玩時重新計算
  save();
  setTimeout(()=>{
    sfx.win();
    const [, ans, , meaning, source] = PUZZLES[L.i];
    $('winAnswer').textContent=ans;
    $('winStars').innerHTML='★★★'.split('').map((s,k)=>`<span class="${k<stars?'':'off'}">★</span>`).join('');
    $('winMeaning').textContent=meaning;
    $('winSource').textContent= source ? `出處：${source}` : '';
    $('winReward').innerHTML = first ? `<span class="coin"></span>+${reward} 金幣${stars===3?'（完美過關加 5）':''}・已收入成語卡冊` : '重玩過關，不再給金幣';
    const last = L.i===PUZZLES.length-1;
    $('winNext').textContent = last ? '回到首頁' : '下一關';
    const beforeRank = rankOf(clearedCount()-(first?1:0)), afterRank = rankOf(clearedCount());
    if(first && beforeRank!==afterRank) setTimeout(()=>toast(`晉升為「${afterRank}」！`),500);
    const seal=$('winSeal'); seal.classList.remove('stamp'); void seal.offsetWidth; seal.classList.add('stamp');
    $('mWin').classList.add('on');
    refreshCoins();
  }, 380);
}
$('winNext').onclick=()=>{
  $('mWin').classList.remove('on'); sfx.tap();
  if(L.i===PUZZLES.length-1){ go('sHome'); return; }
  startLevel(L.i+1);
};

function fmtDate(ms){ if(!ms) return ''; const d=new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

/* ================= 雲端帳號與同步（Firebase） ================= */
function mergeSaves(a, b){
  // a：本機，b：雲端。進度取聯集、計數取最大值，其餘以較新的存檔為準
  const newer = (a.updatedAt||0) >= (b.updatedAt||0) ? a : b;
  const out = normalize(JSON.parse(JSON.stringify(newer)));
  const keys = new Set([...Object.keys(a.cleared||{}), ...Object.keys(b.cleared||{})]);
  out.cleared = {};
  keys.forEach(k=>{
    const x=(a.cleared||{})[k], y=(b.cleared||{})[k];
    if(!x||!y){ out.cleared[k]=x||y; return; }
    const first = (x.t||Infinity) <= (y.t||Infinity) ? x : y;
    const bests=[x.best,y.best].filter(v=>v!=null);
    out.cleared[k] = {...first, stars:Math.max(x.stars||0,y.stars||0), last:Math.max(x.last||0,y.last||0),
      plays:Math.max(x.plays||1,y.plays||1), best: bests.length?Math.min(...bests):undefined};
  });
  Object.keys(out.stats).forEach(k=>{ out.stats[k]=Math.max((a.stats||{})[k]||0,(b.stats||{})[k]||0); });
  DEVICE_PREFS.forEach(k=>{ if(a[k]!==undefined) out[k]=a[k]; });
  out.updatedAt = Date.now();
  return out;
}
function syncable(){
  const o = JSON.parse(JSON.stringify(S)); DEVICE_PREFS.forEach(k=>delete o[k]); return o;
}
const Cloud = {
  state:'off', user:null, lastSync:0, timer:null, auth:null, db:null, busy:false,
  async init(){
    if(!FIREBASE_CONFIG.apiKey){ this.state='off'; this.render(); return; }
    this.state='loading'; this.render();
    try{
      const base='https://www.gstatic.com/firebasejs/10.12.2/';
      for(const f of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js']) await loadScript(base+f);
      firebase.initializeApp(FIREBASE_CONFIG);
      this.auth=firebase.auth(); this.db=firebase.firestore();
      this.auth.getRedirectResult().catch(e=>this.authError(e));
      this.auth.onAuthStateChanged(u=>{ this.user=u; this.state='ready'; this.render(); if(u) this.pull(); });
    }catch(e){ this.state='unavailable'; this.render(); }
  },
  ref(){ return this.db.collection('users').doc(this.user.uid); },
  async pull(){
    if(!this.user) return;
    this.busy=true; this.render();
    try{
      const snap = await this.ref().get();
      if(snap.exists && snap.data().save){
        S = mergeSaves(S, snap.data().save); saveLocal();
        applyTheme(); renderHome(); refreshCoins();
        if($('sLevels').classList.contains('on')) renderLevels();
      }
      await this.push();
    }catch(e){ this.syncError(e); }
  },
  async push(){
    if(!this.user) return;
    clearTimeout(this.timer); this.timer=null;
    this.busy=true;
    try{
      await this.ref().set({ save:syncable(), version:VERSION,
        provider: this.user.isAnonymous?'anonymous':'google',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      this.lastSync=Date.now(); this.busy=false; this.render();
    }catch(e){ this.syncError(e); }
  },
  schedule(){ if(!this.user) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.push(),2500); },
  flush(){ if(this.timer) this.push(); },
  async anon(){ try{ await this.auth.signInAnonymously(); toast('已用訪客身分登入'); }catch(e){ this.authError(e); } },
  async google(){
    const provider=new firebase.auth.GoogleAuthProvider();
    const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    try{
      if(this.user && this.user.isAnonymous){
        await this.user.linkWithPopup(provider);
        await this.user.reload(); this.user=this.auth.currentUser;
        toast('已綁定 Google，進度保留'); this.push(); this.render();
      } else {
        await this.auth.signInWithPopup(provider);
      }
    }catch(e){
      if(e.code==='auth/credential-already-in-use' && e.credential){
        if(!confirm('這個 Google 帳號已經有雲端存檔。要切換到該帳號，並把目前的進度合併進去嗎？')) return;
        try{ await this.auth.signInWithCredential(e.credential); toast('已切換並合併進度'); }catch(e2){ this.authError(e2); }
      } else if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code) && !standalone){
        if(this.user && this.user.isAnonymous) this.user.linkWithRedirect(provider); else this.auth.signInWithRedirect(provider);
      } else this.authError(e);
    }
  },
  async logout(){
    const msg = this.user.isAnonymous
      ? '訪客帳號登出後就無法再找回這個雲端存檔（本機進度會保留）。建議先綁定 Google。確定登出嗎？'
      : '登出後會停止同步，本機進度會保留。確定登出嗎？';
    if(!confirm(msg)) return;
    await this.flush(); await this.auth.signOut(); toast('已登出');
  },
  syncError(e){
    this.busy=false;
    const map={
      'permission-denied':'Firestore 規則不允許讀寫（請檢查規則）',
      'not-found':'找不到 Firestore 資料庫（請先建立）',
      'failed-precondition':'Firestore 資料庫尚未建立或設定不完整',
      'unavailable':'連不上雲端，稍後會再試',
      'unauthenticated':'登入已失效，請重新登入',
    };
    const msg = map[e.code] || ('同步失敗：'+(e.code||e.message||'未知錯誤'));
    console.warn('[Cloud]', e.code, e.message);
    this.render(msg); toast(msg);
  },
  authError(e){
    const map={
      'auth/popup-closed-by-user':'登入視窗被關閉了',
      'auth/cancelled-popup-request':'登入已取消',
      'auth/network-request-failed':'網路連線失敗',
      'auth/unauthorized-domain':'這個網址還沒加入 Firebase 的授權網域',
      'auth/operation-not-allowed':'Firebase 主控台還沒啟用這種登入方式',
      'auth/admin-restricted-operation':'Firebase 主控台還沒啟用匿名登入',
    };
    toast(map[e.code] || ('登入失敗：'+(e.code||e.message)));
  },
  render(note){
    const box=$('account'); if(!box) return;
    const u=this.user;
    let icon='☁️', title='', sub='', btns='';
    if(this.state==='off'){ title='雲端同步未開啟'; sub='在 GitHub Pages 版填入 Firebase 設定後即可登入'; }
    else if(this.state==='unavailable'){ title='無法連線雲端服務'; sub='目前只會存在本機，可稍後再開啟'; }
    else if(this.state==='loading'){ title='連線中…'; }
    else if(!u){
      title='尚未登入'; sub='登入後可在不同裝置接續進度';
      btns=`<button class="btn ghost" data-a="anon">訪客登入</button><button class="btn gg" data-a="google">Google 登入</button>`;
    } else {
      const g=!u.isAnonymous;
      if(g && u.photoURL) icon=`<img src="${u.photoURL}" alt="" referrerpolicy="no-referrer">`; else icon=g?'👤':'🎭';
      title = g ? (u.displayName||'Google 帳號') : '訪客（匿名帳號）';
      sub = note || (this.busy ? '同步中…' : this.lastSync ? `${g?(u.email||'')+'｜':''}已同步 ${fmtDate(this.lastSync)}` : (g?u.email||'':''));
      btns = g ? `<button class="btn ghost" data-a="sync">立即同步</button><button class="btn ghost" data-a="logout">登出</button>`
               : `<button class="btn gg" data-a="google">綁定 Google</button><button class="btn ghost" data-a="logout">登出</button>`;
    }
    box.innerHTML=`<div class="who"><span class="avatar">${icon}</span><div><b>${title}</b><small>${sub}</small></div></div>${btns?`<div class="accBtns">${btns}</div>`:''}`;
    box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ sfx.tap(); ({anon:()=>this.anon(), google:()=>this.google(), logout:()=>this.logout(), sync:()=>this.pull()})[b.dataset.a](); });
    $('cloudLine').textContent = u ? (this.busy?'☁️ 同步中…':`☁️ 已登入${u.isAnonymous?'（訪客）':'（Google）'}`) : '';
  },
};
window.Cloud = Cloud;
function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }

$('verText').textContent = `版本 ${VERSION}（共 ${PUZZLES.length} 關）`;
applyTheme(); renderHome(); refreshCoins(); Cloud.init();
</script>
</body>
